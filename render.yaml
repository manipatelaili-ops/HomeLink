services:
  # HomeLink Spring Boot Backend Service on Render
  - type: web
    name: homelink-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.rtccdmkzgwkebbxmbfjx.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        value: abhignya@18
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://*.vercel.app
