# Production Configuration for Supabase PostgreSQL & Cloud Deployments (Render / Railway)
spring.application.name=homelink-backend
server.port=${PORT:8080}

# Supabase IPv4 Pooler Connection (Required for Render & IPv4-only hosts)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.rtccdmkzgwkebbxmbfjx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abhignya@18}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings optimized for Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Security
homelink.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
homelink.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
homelink.app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://*.vercel.app}
