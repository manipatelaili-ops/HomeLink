# HomeLink - Spring Boot Configuration with Supabase PostgreSQL (IPv4 Pooler)
spring.application.name=homelink-backend
server.port=8080

# Supabase IPv4 Pooler Connection
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.rtccdmkzgwkebbxmbfjx
spring.datasource.password=abhignya@18
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Security
homelink.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
homelink.app.jwtExpirationMs=86400000

# CORS Allowed Origins
homelink.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app
